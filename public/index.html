<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de ayuda</title>
  <!-- Tailwind por CDN: hace falta internet para que carguen los estilos -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="app.js" defer></script>
</head>
<!--
  Esta página todavía no tiene ninguna clase de Tailwind, por eso se ve
  tan plana. Darle forma es el nivel 0 del enunciado.
  Puedes añadir clases y contenedores, pero no cambies los id: app.js
  depende de ellos.
-->
<body class="min-h-screen bg-linear-to-br from-pink-200 via-pink-100 to-rose-200 bg-fixed px-4 pb-10 text-slate-800">
  <header class="mx-auto mt-6 max-w-6xl rounded-3xl bg-linear-to-r from-pink-500 to-rose-500 p-6 text-white shadow-lg">
    <h1 class="text-3xl font-bold">Mesa de ayuda</h1>
    <p class="text-indigo-100">Tickets de soporte de la oficina</p>
  </header>

  <main class="mx-auto grid max-w-6xl gap-6 py-6 lg:grid-cols-3">

    <!-- Formulario: crea tickets y, desde el nivel 4, también los edita -->
    <section class="rounded-3xl bg-white p-6 shadow-md ring-1 ring-slate-200">
      <h2 id="titulo-formulario">Nuevo ticket</h2>

      <form id="form-ticket" novalidate>
        <label for="titulo" class="block mt-4 mb-1 font-medium">Título</label>
        <input id="titulo" name="titulo" type="text" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500">
        <p id="error-titulo" class="text-sm text-red-600"></p>

        <label for="descripcion" class="block mt-4 mb-1 font-medium">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500"></textarea>

        <label for="solicitante" class="block mt-4 mb-1 font-medium">Solicitante</label>
        <input id="solicitante" name="solicitante" type="text" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500">
        <p id="error-solicitante" class="text-sm text-red-600"></p>

        <label for="categoria" class="block mt-4 mb-1 font-medium">Categoría</label>
        <select id="categoria" name="categoria" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500">
          <option value="hardware">Hardware</option>
          <option value="software">Software</option>
          <option value="red">Red</option>
          <option value="accesos">Accesos</option>
        </select>

        <label for="prioridad" class="block mt-4 mb-1 font-medium">Prioridad</label>
        <select id="prioridad" name="prioridad" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500">
          <option value="baja">Baja</option>
          <option value="media" selected>Media</option>
          <option value="alta">Alta</option>
        </select>

        <button id="btn-guardar" type="submit" class="mt-6 rounded-full bg-indigo-600 px-5 py-2 font-medium text-white shadow hover:bg-indigo-700">Crear ticket</button>
        <button id="btn-cancelar" type="button" hidden class="mt-6 ml-2 rounded-full border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancelar edición</button>
      </form>
    </section>

    <!-- Tablero -->
    <section class="rounded-3xl bg-white p-6 shadow-md ring-1 ring-slate-200 lg:col-span-2">
      <h2>Tickets</h2>

      <div id="resumen"></div>

      <div class="mt-4 flex flex-col gap-3 md:flex-row">
        <div>
          <label for="filtro-estado" class="block mb-1 font-medium">Estado</label>
          <select id="filtro-estado" class="w-full border border-slate-300 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="todos">Todos</option>
            <option value="abierto">Abiertos</option>
            <option value="en_progreso">En progreso</option>
            <option value="resuelto">Resueltos</option>
          </select>
        </div>

        <div class="md:flex-1">
          <label for="busqueda" class="block mb-1 font-medium">Buscar</label>
          <input id="busqueda" type="search" placeholder="Buscar por título" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <p id="mensaje"></p>

      <div id="lista-tickets" class="mt-4 grid gap-4 md:grid-cols-2"></div>    </section>

  </main>

</body>
</html>
